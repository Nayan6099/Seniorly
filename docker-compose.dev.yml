version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: seniorly-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-seniorly}
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data_dev:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - seniorly-network-dev

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: seniorly-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - seniorly-network-dev

  # Backend API
  backend:
    image: node:20-alpine
    container_name: seniorly-backend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${PORT:-5000}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/${MONGO_DB_NAME:-seniorly}?authSource=admin
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_here}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
    ports:
      - "8888:5000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./Server:/app
      - /app/node_modules
    networks:
      - seniorly-network-dev

  # Frontend (Next.js)
  frontend:
    image: node:20-alpine
    container_name: seniorly-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8888
      NEXT_PUBLIC_CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./my-nextjs-app:/app
      - /app/node_modules
      - /app/.next
    networks:
      - seniorly-network-dev

volumes:
  mongodb_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  seniorly-network-dev:
    driver: bridge
