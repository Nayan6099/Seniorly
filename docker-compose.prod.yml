version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: seniorly-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: seniorly
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - seniorly-prod-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: seniorly-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - seniorly-prod-network

  # Backend API
  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: seniorly-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/seniorly?authSource=admin
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 7d
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - seniorly-prod-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./my-nextjs-app
      dockerfile: Dockerfile
    container_name: seniorly-frontend-prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL} # e.g. https://api.seniorly.com
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - seniorly-prod-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: seniorly-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - seniorly-prod-network

volumes:
  mongodb_prod_data:
  redis_prod_data:

networks:
  seniorly-prod-network:
    driver: bridge
